<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AFTERFRAME · after the light</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&family=Inter:wght@400;500;600&family=VT323&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { ink: '#1a2a3a' },
        fontFamily: {
          display: ['"Playfair Display"', 'serif'],
          sans: ['Inter', '"Segoe UI"', 'sans-serif'],
          pixel: ['VT323', 'monospace'],
        },
      },
    },
  };
</script>

<!-- 3D 鱼模型的依赖走本地 vendor 目录，不走 CDN -->
<script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three.module.js",
      "three/addons/": "./assets/vendor/jsm/"
    }
  }
</script>

<style>
  /* ==========================================================
     基础
     ========================================================== */
  html { scroll-behavior: smooth; }
  :root {
    --page-gradient: linear-gradient(180deg, #4facfe 0%, #38b6f6 38%, #00c9e8 62%, #a8e6cf 100%);
  }
  body {
    background: var(--page-gradient);
    background-attachment: fixed;
    min-height: 100vh;
  }
  /* 主题切换的过渡层：用 opacity 交叉淡入淡出，避免渐变一瞬间跳变 */
  #themeOverlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0;
    transition: opacity 0.85s ease;
    pointer-events: none;
  }
  body.is-locked { overflow: hidden; height: 100vh; }

  ::selection { background: rgba(61, 155, 255, 0.35); color: #06283d; }
  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.25); }
  ::-webkit-scrollbar-thumb {
    border-radius: 999px;
    background: linear-gradient(180deg, #bdeaff, #4db2ec);
    border: 2px solid rgba(255, 255, 255, 0.5);
  }

  .meta-label {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    font-weight: 600; color: rgba(14, 49, 80, 0.62);
  }

  /* ==========================================================
     ★ 全局漂浮泡泡（覆盖所有页面：开机 / 桌面 / 作品集）
     三层结构：外层定位 → 浮力层做上升动画 → 内层玻璃质感并接收点击
     这样"破裂"动画只作用于内层，不会打断上升位移（避免泡泡瞬移）
     ========================================================== */
  #globalBubbles {
    position: fixed; inset: 0; z-index: 200;
    pointer-events: none; overflow: hidden;
  }
  .g-bubble { position: absolute; }
  .g-bubble-float {
    width: 100%; height: 100%;
    pointer-events: none;
    animation: gFloat linear infinite;
    will-change: transform;
  }
  .g-bubble-inner {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    pointer-events: auto; cursor: pointer;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.25) 40%, rgba(160,220,255,0.32) 100%);
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow:
      inset 0 2px 6px rgba(255,255,255,0.85),
      inset -4px -7px 14px rgba(90,170,220,0.35),
      0 2px 10px rgba(30,110,170,0.2);
  }
  @keyframes gFloat {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(20px, -28vh); }
    50%  { transform: translate(-16px, -56vh); }
    75%  { transform: translate(24px, -84vh); }
    100% { transform: translate(-12px, -114vh); opacity: 0.75; }
  }

  /* ===== 页面环境特效层 ===== */
  #fxLayer {
    position: fixed; inset: 0; z-index: 202;
    width: 100%; height: 100%;
    pointer-events: none;
    display: block;
  }
  /* p2 金属光泽：一条斜向亮带从左扫到右 */
  #fxShine {
    position: fixed; inset: 0; z-index: 203;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
  }
  #fxShine::before {
    content: "";
    position: absolute;
    top: -50%; left: -60%;
    width: 55%; height: 200%;
    background: linear-gradient(115deg,
      transparent 0%,
      rgba(255,255,255,0) 38%,
      rgba(255,255,255,0.55) 48%,
      rgba(255,255,255,0.85) 50%,
      rgba(255,255,255,0.55) 52%,
      rgba(255,255,255,0) 62%,
      transparent 100%);
    filter: blur(6px);
    transform: translateX(0);
  }
  #fxShine.is-on { opacity: 1; }
  #fxShine.is-on::before { animation: shineSweep 3.2s ease-in-out infinite; }
  @keyframes shineSweep {
    0%   { transform: translateX(-20%) skewX(-18deg); }
    100% { transform: translateX(360%) skewX(-18deg); }
  }

  /* —— 戳破：内层先膨胀再爆开 —— */
  .g-bubble.popped .g-bubble-inner { animation: bubblePop 0.34s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
  @keyframes bubblePop {
    0%   { transform: scale(1); opacity: 1; }
    38%  { transform: scale(1.42); opacity: 0.92; }
    100% { transform: scale(1.75); opacity: 0; }
  }
  /* 破裂白光 */
  .g-flash {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,0.98) 0%, rgba(220,245,255,0.55) 42%, rgba(255,255,255,0) 72%);
    animation: flashOut 0.28s ease-out forwards;
  }
  @keyframes flashOut {
    0%   { transform: scale(0.55); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }
  /* 双层扩散水环 */
  .g-ring {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 12px rgba(150, 225, 255, 0.9), inset 0 0 9px rgba(255, 255, 255, 0.85);
    animation: ringOut 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }
  @keyframes ringOut {
    0%   { transform: scale(0.55); opacity: 1; border-width: 3px; }
    100% { transform: scale(2.7); opacity: 0; border-width: 1px; }
  }
  /* 飞溅水珠 */
  .g-splash {
    position: absolute; left: 50%; top: 50%;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #ffffff, rgba(190, 235, 255, 0.85));
    box-shadow: 0 0 6px rgba(180, 230, 255, 0.95);
    transform: translate(-50%, -50%);
    animation: splashOut 0.44s cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
  }
  @keyframes splashOut {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.12); opacity: 0; }
  }
  /* 点击鱼时冒出的水泡 */
  .puff {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 201;
    background: radial-gradient(circle at 35% 30%, #ffffff, rgba(190, 235, 255, 0.55));
    border: 1px solid rgba(255, 255, 255, 0.85);
    animation: puffUp 0.85s ease-out forwards;
  }
  @keyframes puffUp {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: translateY(-52px) scale(1.35); opacity: 0; }
  }

  /* ==========================================================
     ★ 热带鱼层（覆盖所有页面，点击会受惊游走）
     ========================================================== */
  #fishLayer {
    position: fixed; inset: 0; z-index: 196;
    pointer-events: none; overflow: hidden;
  }
  #fishCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; pointer-events: none;
  }
  /* 透明命中框：每帧跟随对应鱼的屏幕位置，只负责接收点击 */
  .fish-hit {
    position: absolute; left: 0; top: 0;
    pointer-events: auto; cursor: pointer;
    border-radius: 50%;
    transition: opacity 0.15s ease;
    will-change: transform, width, height;
  }

  /* ==========================================================
     ★ 背景音乐（开机结束后自动播放）
     胶囊同时是浏览器拦截自动播放时的"手动播放"入口
     ========================================================== */
  #bgmAudio { display: none; }

  /* 鼠标拖尾画布（蓝绿渐变，覆盖所有页面，不拦截任何交互） */
  #mouseTrail { position: fixed; inset: 0; z-index: 300; pointer-events: none; }

  .bgm-pill {
    position: fixed; right: 18px; top: 84px; z-index: 210;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 15px 8px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.78);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(206, 236, 255, 0.66));
    box-shadow: 0 12px 26px -12px rgba(8, 60, 110, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    -webkit-backdrop-filter: blur(12px) saturate(1.6);
    backdrop-filter: blur(12px) saturate(1.6);
    color: #123a5c; cursor: pointer; text-align: left;
    font-family: Inter, "Segoe UI", sans-serif;
    opacity: 0; pointer-events: none;
    transform: translateY(-8px);
    transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.2s ease;
  }
  .bgm-pill.is-on { opacity: 1; pointer-events: auto; transform: none; }
  .bgm-pill:hover { box-shadow: 0 16px 30px -12px rgba(8, 60, 110, 0.7), inset 0 1px 0 rgba(255, 255, 255, 1); }
  .bgm-pill.is-off { cursor: default; filter: grayscale(0.45); opacity: 0.75; }
  .bgm-bars { display: flex; align-items: flex-end; gap: 2px; width: 16px; height: 16px; }
  .bgm-bars i {
    flex: 1; height: 5px; border-radius: 2px;
    background: linear-gradient(180deg, #6ccdff, #0f7fc4);
    animation-play-state: paused;
  }
  .bgm-pill.is-playing .bgm-bars i { animation: bgmBar 0.85s ease-in-out infinite alternate; }
  .bgm-pill.is-playing .bgm-bars i:nth-child(1) { animation-delay: 0s; }
  .bgm-pill.is-playing .bgm-bars i:nth-child(2) { animation-delay: 0.18s; }
  .bgm-pill.is-playing .bgm-bars i:nth-child(3) { animation-delay: 0.32s; }
  .bgm-pill.is-playing .bgm-bars i:nth-child(4) { animation-delay: 0.1s; }
  @keyframes bgmBar { from { height: 4px; } to { height: 15px; } }
  .bgm-text { display: flex; flex-direction: column; line-height: 1.25; }
  .bgm-title { font-size: 12px; font-weight: 600; }
  .bgm-hint { font-size: 10px; opacity: 0.62; letter-spacing: 0.03em; }
  @media (max-width: 640px) {
    .bgm-pill { right: 12px; top: 78px; padding: 7px 12px 7px 9px; max-width: 62vw; }
    .bgm-title { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bgm-hint { font-size: 9px; }
  }

  /* ==========================================================
     第一层：Y2K 开机加载
     ========================================================== */
  #boot {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 1.25rem;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(56, 189, 248, 0.35), transparent 60%),
      linear-gradient(165deg, #071a33 0%, #0b2a52 45%, #10407c 100%);
    transition: opacity 0.6s ease;
  }
  #boot.is-done { opacity: 0; pointer-events: none; }
  #boot::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);
  }

  .boot-window {
    position: relative; z-index: 2;
    width: 100%; max-width: 560px;
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, rgba(10, 34, 66, 0.92), rgba(6, 22, 44, 0.95));
    border: 1px solid rgba(140, 210, 255, 0.35);
    box-shadow: 0 30px 80px -20px rgba(0, 10, 30, 0.9), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .boot-titlebar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    background: linear-gradient(180deg, #eef7ff, #b9d9f2);
    border-bottom: 1px solid rgba(20, 60, 100, 0.35);
  }
  .boot-dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 -2px 3px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.7); }
  .boot-title {
    margin-left: 6px;
    font-family: Tahoma, sans-serif; font-size: 12px; font-weight: 700;
    color: #1c4066;
  }
  .boot-body { padding: 34px 30px 26px; }

  .boot-brand {
    font-family: Tahoma, sans-serif; font-size: 12px; letter-spacing: 0.28em;
    color: rgba(160, 220, 255, 0.75); text-transform: uppercase;
  }
  .boot-counter {
    font-family: VT323, monospace;
    font-size: clamp(64px, 14vw, 110px); line-height: 1;
    color: #bfe9ff;
    text-shadow: 0 0 18px rgba(90, 200, 255, 0.75), 0 0 46px rgba(60, 160, 255, 0.4);
    margin: 10px 0 22px;
  }
  .seg-track {
    height: 18px; padding: 2px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(140, 210, 255, 0.3); border-radius: 4px;
  }
  .seg-fill {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg, #8fe3ff 0 10px, #35a8f0 10px 12px);
    box-shadow: 0 0 14px rgba(90, 200, 255, 0.55);
    border-radius: 2px;
  }
  .boot-log {
    margin-top: 20px; min-height: 96px;
    font-family: VT323, monospace; font-size: 17px; line-height: 1.5;
    color: #9fd4f5;
  }
  .boot-log .ok { color: #7dffa8; }
  .boot-hint {
    margin-top: 18px; text-align: center;
    font-family: VT323, monospace; font-size: 15px;
    color: rgba(160, 220, 255, 0.55);
    animation: blink 1.2s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ==========================================================
     第二层：千禧年电脑桌面
     ========================================================== */
  #desktop {
    position: fixed; inset: 0; z-index: 90;
    overflow: hidden;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  #desktop.is-leaving { opacity: 0; transform: scale(1.05); pointer-events: none; }
  #desktopWall { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #desktop .wall-sheen {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.25), transparent 55%);
  }

  .d-icons {
    position: absolute; top: 22px; left: 22px;
    display: flex; flex-direction: column; gap: 26px;
  }
  .d-icon {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 92px; padding: 8px 4px;
    background: none; border: 1px dotted transparent; border-radius: 6px;
    cursor: grab; user-select: none;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
    animation: iconPop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
    touch-action: none;
    will-change: transform;
  }
  .d-icon:nth-child(2) { animation-delay: 0.12s; }
  @keyframes iconPop { from { opacity: 0; transform: translateY(10px) scale(0.85); } to { opacity: 1; transform: none; } }
  .d-icon:hover { background: rgba(255, 255, 255, 0.14); }
  .d-icon:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .d-icon.is-selected { background: rgba(31, 95, 208, 0.45); border-color: rgba(255, 255, 255, 0.65); }
  .d-icon svg { width: 46px; height: 46px; filter: drop-shadow(0 3px 4px rgba(0, 20, 40, 0.45)); pointer-events: none; }
  .d-icon span {
    font-family: Tahoma, 'Segoe UI', sans-serif; font-size: 12px;
    color: #ffffff; text-shadow: 0 1px 3px rgba(0, 25, 50, 0.85);
    text-align: center; line-height: 1.25;
    max-width: 88px; word-break: break-all; pointer-events: none;
  }

  .d-icon.dragging {
    cursor: grabbing;
    z-index: 50;
    filter: drop-shadow(0 18px 14px rgba(0, 20, 40, 0.45));
    transition: background 0.15s ease, filter 0.2s ease;
  }
  .d-icon.bin-hover {
    background: rgba(255, 210, 70, 0.55);
    border-color: #fff;
    filter: drop-shadow(0 0 16px rgba(255, 210, 70, 0.9)) drop-shadow(0 3px 4px rgba(0,20,40,0.45));
    animation: binPulse 0.5s ease-in-out infinite alternate;
  }
  @keyframes binPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  .d-icon.folding {
    animation: foldIn 0.45s ease-in forwards;
    pointer-events: none;
  }
  @keyframes foldIn {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    60%  { transform: scale(0.4) rotate(-18deg) translateY(10px); opacity: 0.7; }
    100% { transform: scale(0) rotate(-40deg) translateY(30px); opacity: 0; }
  }
  .d-icon.bin-flash { animation: binShake 0.4s ease; }
  @keyframes binShake {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
    75% { transform: rotate(-3deg); }
  }

  .d-toast {
    position: absolute; left: 24px; bottom: 58px;
    max-width: 260px;
    padding: 10px 14px;
    border-radius: 12px 12px 12px 4px;
    font-family: Tahoma, sans-serif; font-size: 12px; line-height: 1.5;
    color: #0e3150;
    background: linear-gradient(180deg, #ffffff, #e6f7ff);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 10px 24px -10px rgba(10, 60, 110, 0.55), inset 0 1px 0 #ffffff;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .d-toast.is-show { opacity: 1; transform: none; }

  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 46px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px 0 0;
    background: linear-gradient(180deg, #5ea0f7 0%, #2f7ae8 8%, #1e63d2 50%, #1a55b8 92%, #3d86ef 100%);
    border-top: 1px solid rgba(255, 255, 255, 0.55);
    box-shadow: 0 -2px 12px rgba(10, 40, 90, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .start-btn {
    position: relative;
    display: flex; align-items: center; gap: 7px;
    height: 100%; padding: 0 20px 0 14px;
    border: none; cursor: pointer;
    font-family: Tahoma, sans-serif; font-size: 14px; font-weight: 700; font-style: italic;
    color: #ffffff; text-shadow: 0 1px 2px rgba(0, 60, 0, 0.6);
    background: linear-gradient(180deg, #8fd96a 0%, #4da32e 45%, #3a8a1f 55%, #54b637 100%);
    border-radius: 0 14px 14px 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -6px 10px rgba(20, 90, 0, 0.35), 2px 0 8px rgba(10, 40, 90, 0.4);
    transition: filter 0.2s ease;
  }
  .start-btn:hover { filter: brightness(1.08); }
  .start-orb {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #ffffff, #bfeaff 40%, #38bdf8 75%, #0b6fa4);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 1px 3px rgba(0,40,20,0.5);
  }
  .taskbar-title {
    font-family: Tahoma, sans-serif; font-size: 12px;
    color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 2px rgba(0, 30, 70, 0.6);
  }
  .taskbar-clock {
    margin-left: auto;
    display: flex; align-items: center;
    height: 34px; padding: 0 14px;
    font-family: Tahoma, sans-serif; font-size: 12px; color: #fff;
    background: linear-gradient(180deg, #3f8ef0, #2a6fd6);
    border-left: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    text-shadow: 0 1px 2px rgba(0, 30, 70, 0.6);
  }
  @media (max-width: 560px) {
    .taskbar-title { display: none; }
    .d-icons { top: 14px; left: 14px; gap: 18px; }
  }

  /* ==========================================================
     第三层：作品集正文
     ========================================================== */
  #site { display: none; }
  #site.is-open { display: block; animation: siteOpen 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  @keyframes siteOpen { from { opacity: 0; transform: scale(0.975) translateY(10px); } to { opacity: 1; transform: none; } }

  .sun-flare { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 62%); filter: blur(6px); }
  .cloud {
    position: absolute; border-radius: 999px; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%);
    filter: blur(10px);
    animation: drift linear infinite;
  }
  @keyframes drift { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
  .bubble {
    position: absolute; bottom: -40px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 45%, rgba(160,220,255,0.25));
    border: 1px solid rgba(255,255,255,0.6);
    animation: floatUp linear infinite;
    pointer-events: none;
  }
  @keyframes floatUp {

  .play-btn::before { content: ""; position: absolute; left: 18%; right: 18%; top: 9%; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0)); pointer-events: none; }

  /* ============================================================
     工具
     ============================================================ */
  const el = (id) => document.getElementById(id);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  /* ============================================================
     ★ 全局漂浮泡泡（覆盖所有页面，点击触发爆裂特效）
     ============================================================ */
  function spawnGlobalBubbles() {
    const container = el('globalBubbles');
    if (!container) return;
    const MAX = 34;

    function makeBubble() {
      const size = 14 + Math.random() * 30;
      const wrap = document.createElement('div');
      wrap.className = 'g-bubble';
      wrap.style.width = size + 'px';
      wrap.style.height = size + 'px';
      wrap.style.left = Math.random() * 100 + 'vw';
      wrap.style.bottom = -(size + 12) + 'px';

      const float = document.createElement('div');
      float.className = 'g-bubble-float';
      const dur = 16 + Math.random() * 18;
      float.style.animationDuration = dur + 's';
      float.style.animationDelay = (-Math.random() * dur) + 's';

      const inner = document.createElement('div');
      inner.className = 'g-bubble-inner';
      inner.style.opacity = (0.72 + Math.random() * 0.28).toFixed(2);

      float.appendChild(inner);
      wrap.appendChild(float);
      container.appendChild(wrap);

      inner.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        popBubble(wrap, inner, float);
      });

      setTimeout(() => { if (wrap.parentNode) wrap.remove(); }, dur * 1000 + 2000);
    }

    /** 戳破：膨胀爆开 + 白光闪 + 双层水环 + 水珠飞溅 */
    function popBubble(wrap, inner, float) {
      if (wrap.classList.contains('popped')) return;
      wrap.classList.add('popped');
      inner.style.pointerEvents = 'none';
      inner.style.animation = 'none';   // 停掉内层若有动画，交给 .popped 接管

      // 白光闪
      const flash = document.createElement('div');
      flash.className = 'g-flash';
      float.appendChild(flash);

      // 双层错峰扩散的水环
      for (let k = 0; k < 2; k++) {
        const ring = document.createElement('div');
        ring.className = 'g-ring';
        ring.style.animationDelay = (k * 0.07) + 's';
        float.appendChild(ring);
      }

      // 水珠向四周飞溅（略带上抛感）
      const n = 10;
      for (let i = 0; i < n; i++) {
        const drop = document.createElement('div');
        drop.className = 'g-splash';
        const sz = 3 + Math.random() * 5;
        drop.style.width = sz + 'px';
        drop.style.height = sz + 'px';
        const angle = (i / n) * Math.PI * 2 + Math.random() * 0.5;
        const dist = 26 + Math.random() * 30;
        drop.style.setProperty('--dx', (Math.cos(angle) * dist).toFixed(1) + 'px');
        drop.style.setProperty('--dy', (Math.sin(angle) * dist - 6).toFixed(1) + 'px');
        drop.style.animationDelay = (Math.random() * 0.05) + 's';
        float.appendChild(drop);
      }

      setTimeout(() => { if (wrap.parentNode) wrap.remove(); }, 520);
    }

    for (let i = 0; i < 14; i++) setTimeout(makeBubble, i * 130);
    setInterval(() => {
      if (container.children.length < MAX) makeBubble();
    }, 620);
  }

  /* ============================================================
     ★ 热带鱼（覆盖所有页面，点击受惊快速游走）
     ============================================================ */
  const FISH_CFG = {
    // fish.fbx (45MB) 拆成 6 片存在 assets/fish.fbx.part01~06，加载时拼接
    chunkCount: 6,
    max: 6,            // 桌面端同屏上限
    maxMobile: 4,      // 移动端同屏上限
    len: [48, 86],     // 鱼身长度（屏幕像素）
    cross: [26, 46],   // 横穿一屏所需秒数
    texMax: 512,       // 模型贴图原为 2048²，降采样省显存
  };

  const fishState = {
    started: false, ready: false, failed: false,
    species: [], list: [],
    THREE: null, scene: null, camera: null, renderer: null,
    W: 0, H: 0, dist: 0, last: 0, raf: 0,
  };

  function fishMax() {
    return window.innerWidth < 640 ? FISH_CFG.maxMobile : FISH_CFG.max;
  }

  /** 等 three.js / FBXLoader 就绪后再加载鱼模型 */
  function setupFish() {
    if (!el('fishLayer') || !el('fishCanvas')) return;
    if (window.__threeReady) loadFishModel();
    else window.addEventListener('three-ready', loadFishModel, { once: true });
  }

  function loadFishModel() {
    const S = fishState;
    if (S.started || !window.__threeReady) return;
    S.started = true;

    const { THREE, FBXLoader } = window.__threeReady;
    S.THREE = THREE;

    const renderer = new THREE.WebGLRenderer({ canvas: el('fishCanvas'), antialias: true, alpha: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    S.renderer = renderer;

    S.scene = new THREE.Scene();
    S.scene.add(new THREE.HemisphereLight(0xffffff, 0x4d7ea8, 2.5));
    const key = new THREE.DirectionalLight(0xffffff, 2.3);
    key.position.set(1.4, 2.2, 3.0);
    S.scene.add(key);
    const rim = new THREE.DirectionalLight(0xbfe4ff, 1.2);
    rim.position.set(-2.2, -1.0, 1.6);
    S.scene.add(rim);

    S.camera = new THREE.PerspectiveCamera(45, 1, 1, 6000);
    layoutFishLayer();
    window.addEventListener('resize', layoutFishLayer);

    // fish.fbx (45MB) 拆成 6 个分片存储，下载后拼接再交给 FBXLoader.parse
    window.__fishStatus = 'start-fetch-chunks';
    const chunkCount = FISH_CFG.chunkCount;
    const chunkUrls = [];
    for (let i = 1; i <= chunkCount; i++) {
      chunkUrls.push('./assets/fish.fbx.part' + String(i).padStart(2, '0'));
    }
    Promise.all(chunkUrls.map(u => fetch(u).then(r => {
      if (!r.ok) throw new Error(u + ' ' + r.status);
      return r.arrayBuffer();
    }))).then(buffers => {
      const total = buffers.reduce((s, b) => s + b.byteLength, 0);
      window.__fishStatus = 'chunks-loaded total=' + total;
      const merged = new Uint8Array(total);
      let off = 0;
      for (const b of buffers) { merged.set(new Uint8Array(b), off); off += b.byteLength; }
      window.__fishStatus = 'parsing-fbx';
      // FBXLoader.parse 是同步方法，直接返回对象（不接受回调）
      let obj;
      try {
        obj = new FBXLoader().parse(merged.buffer, '');
      } catch (err) {
        S.failed = true;
        window.__fishStatus = 'parse-error: ' + err;
        console.warn('[fish] 模型解析失败：', err);
        return;
      }
      S.species = buildFishSpecies(obj);
      window.__fishStatus = 'parsed species=' + S.species.length;
      if (!S.species.length) { S.failed = true; return; }
      S.ready = true;
      for (let i = 0; i < Math.min(3, fishMax()); i++) setTimeout(makeFish3D, i * 900);
      setTimeout(() => { if (S.list.length < fishMax()) makeFish3D(); }, 1600);
      setInterval(() => { if (S.list.length < fishMax()) makeFish3D(); }, 3200);
      S.last = performance.now();
      S.raf = requestAnimationFrame(tickFish);
      window.__fishStatus = 'running fish=' + S.list.length;
    }).catch(err => { S.failed = true; window.__fishStatus = 'fetch-error: ' + err; console.warn('[fish] 分片下载失败：', err); });
  }

  /** 视口尺寸变化时同步相机与渲染尺寸（世界单位 = CSS 像素） */
  function layoutFishLayer() {
    const S = fishState;
    if (!S.renderer || !S.camera) return;
    S.W = window.innerWidth;
    S.H = window.innerHeight;
    S.renderer.setSize(S.W, S.H, false);
    S.camera.aspect = S.W / S.H;
    S.camera.updateProjectionMatrix();
    S.dist = (S.H / 2) / Math.tan((S.camera.fov * Math.PI) / 360);
    S.camera.position.set(0, 0, S.dist);
    S.camera.lookAt(0, 0, 0);
  }

  /** 把 FBX 里每个 mesh 变成"长轴 1 单位、几何中心在原点"的鱼模板 */
  function buildFishSpecies(root) {
    const THREE = fishState.THREE;
    const out = [];
    root.updateMatrixWorld(true);

    const meshes = [];
    root.traverse((o) => {
      if (o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o);
    });

    meshes.forEach((mesh) => {
      const holder = new THREE.Group();
      const clone = mesh.clone();
      holder.add(clone);

      const box = new THREE.Box3().setFromObject(holder);
      if (box.isEmpty() || !isFinite(box.min.x)) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      clone.position.sub(center);        // 几何中心归零（位移最后生效，不影响朝向）

      compressFishTextures(holder, FISH_CFG.texMax);

      out.push({
        root: holder,
        len: Math.max(size.x, 1e-3),
        aspect: Math.max(size.y / Math.max(size.x, 1e-3), 0.2),
      });
    });
    return out;
  }

  /** 模型自带 15 张 2048² 贴图，先降采样再上传 GPU */
  function compressFishTextures(root, maxSize) {
    const THREE = fishState.THREE;
    const cache = new Map();

    const shrink = (tex) => {
      if (!tex || !tex.image || !tex.image.width || tex.image.width <= maxSize) return tex;
      if (cache.has(tex)) return cache.get(tex);
      const cv = document.createElement('canvas');
      cv.width = maxSize;
      cv.height = maxSize;
      cv.getContext('2d').drawImage(tex.image, 0, 0, maxSize, maxSize);
      const nt = new THREE.CanvasTexture(cv);
      nt.flipY = tex.flipY;
      nt.colorSpace = tex.colorSpace;
      nt.wrapS = tex.wrapS;
      nt.wrapT = tex.wrapT;
      nt.repeat.copy(tex.repeat);
      nt.offset.copy(tex.offset);
      nt.needsUpdate = true;
      cache.set(tex, nt);
      return nt;
    };

    root.traverse((o) => {
      if (!o.isMesh) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        if (!m) return;
        if (m.map) m.map = shrink(m.map);
        if (m.emissiveMap) m.emissiveMap = shrink(m.emissiveMap);
        if (m.specularMap) m.specularMap = shrink(m.specularMap);
        m.transparent = true;          // 受惊时要淡出
        m.opacity = 1;
        m.side = THREE.DoubleSide;     // 鱼鳍很薄，双面渲染避免破面
      });
    });
  }

  function makeFish3D() {
    const S = fishState;
    if (!S.ready) return;
    const THREE = S.THREE;

    const sp = S.species[Math.floor(Math.random() * S.species.length)];
    const dir = Math.random() < 0.5 ? 1 : -1;              // 1 向右，-1 向左
    const len = FISH_CFG.len[0] + Math.random() * (FISH_CFG.len[1] - FISH_CFG.len[0]);
    const cross = FISH_CFG.cross[0] + Math.random() * (FISH_CFG.cross[1] - FISH_CFG.cross[0]);

    const wrap = new THREE.Group();
    const inst = sp.root.clone(true);                      // 几何体共享，材质按实例复制
    const mats = [];
    inst.traverse((o) => {
      if (!o.isMesh) return;
      const list = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
      o.material = list;
      (Array.isArray(list) ? list : [list]).forEach((m) => {
        m.transparent = true;
        m.opacity = 1;
        mats.push(m);
      });
    });
    wrap.add(inst);
    S.scene.add(wrap);

    const y = S.H / 2 - (60 + Math.random() * Math.max(S.H - 160, 40));
    const fish = {
      wrap, mats, dir, len, aspect: sp.aspect,
      x: dir > 0 ? -(S.W / 2) - len : (S.W / 2) + len,
      y, baseY: y,
      z: -150 + Math.random() * 300,
      speed: (S.W * 1.25) / cross,
      phase: Math.random() * Math.PI * 2,
      bob: 7 + Math.random() * 9,
      wob: 0.5 + Math.random() * 0.5,
      scale: len / sp.len,
      opacity: 1, state: 'swim', t: 0, hit: null,
    };

    wrap.position.set(fish.x, fish.y, fish.z);
    wrap.rotation.y = dir > 0 ? 0 : Math.PI;
    wrap.scale.setScalar(fish.scale);

    // 透明命中框：只负责接收点击，不挡住页面其它交互
    const hit = document.createElement('div');
    hit.className = 'fish-hit';
    hit.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
      fleeFish(fish, e.clientX, e.clientY);
    });
    el('fishLayer').appendChild(hit);
    fish.hit = hit;

    S.list.push(fish);
  }

  function tickFish(now) {
    const S = fishState;
    if (!S.ready) return;
    S.raf = requestAnimationFrame(tickFish);

    const dt = Math.min(Math.max((now - S.last) / 1000, 0), 0.05);
    S.last = now;

    for (let i = S.list.length - 1; i >= 0; i--) {
      const f = S.list[i];
      f.phase += dt * 1.7 * f.wob;

      if (f.state === 'flee') {
        f.t = Math.min(f.t + dt, 0.92);
        const p = f.t / 0.92;
        f.x += f.dir * (f.speed * 0.4 + 2000 * (1 - p * 0.45)) * dt;
        f.wrap.scale.setScalar(f.scale * (1 - 0.34 * p));
        setFishOpacity(f, Math.max(1 - p * 1.08, 0));
        if (p >= 1) { dropFish(i); continue; }
      } else {
        f.x += f.dir * f.speed * dt;
        f.y = f.baseY + Math.sin(f.phase) * f.bob;
        if (f.dir > 0 ? f.x - f.len > S.W / 2 : f.x + f.len < -S.W / 2) { dropFish(i); continue; }
      }

      f.wrap.position.set(f.x, f.y, f.z);
      f.wrap.rotation.y = f.dir > 0 ? 0 : Math.PI;
      f.wrap.rotation.z = Math.sin(f.phase) * 0.055;

      // 命中框跟随：世界坐标 → 屏幕坐标（按深度做透视缩放）
      const k = S.dist / (S.dist - f.z);
      const w = f.len * k * 0.8;
      const hh = f.len * f.aspect * k * 0.8;
      f.hit.style.width = w.toFixed(1) + 'px';
      f.hit.style.height = hh.toFixed(1) + 'px';
      f.hit.style.transform =
        `translate3d(${(S.W / 2 + f.x * k - w / 2).toFixed(1)}px, ${(S.H / 2 - f.y * k - hh / 2).toFixed(1)}px, 0)`;
    }

    S.renderer.render(S.scene, S.camera);
  }

  function setFishOpacity(f, v) {
    if (Math.abs(f.opacity - v) < 0.01) return;
    f.opacity = v;
    f.mats.forEach((m) => { m.opacity = v; });
  }

  function dropFish(i) {
    const S = fishState;
    const f = S.list[i];
    if (!f) return;
    S.list.splice(i, 1);
    S.scene.remove(f.wrap);
    if (f.hit && f.hit.parentNode) f.hit.remove();
    f.mats.forEach((m) => m.dispose());
  }

  /** 受惊游走：冒出小水泡，朝原方向加速缩小淡出，约 0.9 秒后回收 */
  function fleeFish(f, x, y) {
    if (f.state === 'flee') return;
    f.state = 'flee';
    f.t = 0;
    if (f.hit) {
      f.hit.style.pointerEvents = 'none';
      f.hit.style.opacity = '0';
    }
    puffAt(x, y);
  }

  /** 点击鱼时在点击位置冒出一撮小水泡 */
  function puffAt(x, y) {
    const layer = el('globalBubbles');
    if (!layer) return;
    for (let i = 0; i < 7; i++) {
      const p = document.createElement('div');
      p.className = 'puff';
      const sz = 4 + Math.random() * 8;
      p.style.width = sz + 'px';
      p.style.height = sz + 'px';
      p.style.left = (x + (Math.random() * 30 - 15)) + 'px';
      p.style.top = (y + (Math.random() * 26 - 13)) + 'px';
      p.style.animationDelay = (i * 0.045) + 's';
      layer.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  /* ============================================================
     第一层：开机加载
     ============================================================ */
  function runBoot(onDone) {
    const cfg = siteData.boot;
    el('bootTitle').textContent = cfg.windowTitle;
    el('bootBrand').textContent = cfg.brand;
    el('bootHint').textContent = cfg.hint;

    const counter = el('bootCounter'), bar = el('bootBar'), log = el('bootLog');
    const duration = cfg.duration || 2800;
    const start = performance.now();
    let finished = false;
    let shownLines = 0;

    const finish = () => {
      if (finished) return;
      finished = true;
      counter.textContent = '100%';
      bar.style.width = '100%';
      renderLines(100);
      setTimeout(() => {
        el('boot').classList.add('is-done');
        setTimeout(() => { el('boot').style.display = 'none'; onDone(); }, 600);
      }, 420);
    };

    function renderLines(progress) {
      const due = cfg.lines.filter((l) => l.at <= progress);
      if (due.length === shownLines) return;
      shownLines = due.length;
      log.innerHTML = due
        .slice(-4)
        .map((l, i, arr) => `<div>${l.text}${i < arr.length - 1 ? ' <span class="ok">OK</span>' : ''}</div>`)
        .join('');
    }

    const tick = (now) => {
      if (finished) return;
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 1.6);
      const progress = Math.floor(eased * 100);
      counter.textContent = `${progress}%`;
      bar.style.width = `${progress}%`;
      renderLines(progress);
      if (t >= 1) finish(); else requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    window.addEventListener('keydown', finish, { once: true });
    el('boot').addEventListener('click', finish, { once: true });
  }

  /* ============================================================
     第二层：电脑桌面 —— 把文件夹拖进回收站打开网站
     ============================================================ */
  let toastTimer = null;

  function showToast(text) {
    const toast = el('desktopToast');
    toast.textContent = text;
    toast.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('is-show'), 2400);
  }

  function hit(el, x, y) {
    const r = el.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  function setupDesktop() {
    const d = siteData.desktop;
    el('desktopWall').src = d.wallpaper;
    el('folderName').textContent = d.folderName;
    el('binName').textContent = d.binName;
    el('startLabel').textContent = d.startLabel;
    el('taskbarTitle').textContent = d.taskbarTitle;

    const clock = el('clock');
    const updateClock = () => {
      clock.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    };
    updateClock();
    setInterval(updateClock, 15000);

    const folder = el('folderIcon'), bin = el('binIcon');

    $$('.d-icon').forEach((icon) => {
      icon.addEventListener('click', () => {
        $$('.d-icon').forEach((i) => i.classList.remove('is-selected'));
        icon.classList.add('is-selected');
      });
    });

    let drag = null;

    folder.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      drag = {
        startX: e.clientX, startY: e.clientY,
        moved: false, overBin: false,
      };
      try { folder.setPointerCapture(e.pointerId); } catch (_) {}
      folder.classList.add('dragging');
      e.preventDefault();
    });

    folder.addEventListener('pointermove', (e) => {
      if (!drag) return;
      drag.moved = true;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      folder.style.transform = `translate(${dx}px, ${dy}px) scale(1.1) rotate(-3deg)`;

      const over = hit(bin, e.clientX, e.clientY);
      if (over !== drag.overBin) {
        drag.overBin = over;
        bin.classList.toggle('bin-hover', over);
      }
    });

    const endDrag = (e) => {
      if (!drag) return;
      const over = drag.overBin || hit(bin, e.clientX, e.clientY);
      folder.classList.remove('dragging');
      bin.classList.remove('bin-hover');
      try { folder.releasePointerCapture(e.pointerId); } catch (_) {}

      if (drag.moved && over) {
        bin.classList.add('bin-flash');
        folder.classList.add('folding');
        showToast('正在打开「个人网站」…');
        setTimeout(() => {
          bin.classList.remove('bin-flash');
          folder.classList.remove('folding');
          folder.style.transform = '';
          openSite();
        }, 480);
      } else {
        folder.style.transform = '';
        if (!drag.moved) showToast(d.folderToast);
      }
      drag = null;
    };

    folder.addEventListener('pointerup', endDrag);
    folder.addEventListener('pointercancel', endDrag);

    folder.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openSite();
      }
    });

    bin.addEventListener('click', () => showToast(d.binToast));
    el('startBtn').addEventListener('click', () => showToast(d.startToast));
  }

  function showDesktop() {
    const desk = el('desktop');
    desk.style.display = 'block';
    requestAnimationFrame(() => desk.classList.remove('is-leaving'));
    document.body.classList.add('is-locked');
    revealBgm();            // 开机结束 —— 露出音乐胶囊（音乐在打开页面时已开始）
  }

  /* ============================================================
     背景音乐 —— 打开页面即自动播放
     ============================================================ */
  const bgmState = { want: false, failed: false, fadeTimer: 0 };

  function setupBgm() {
    const cfg = siteData.bgm;
    const audio = el('bgmAudio'), pill = el('bgmToggle');
    if (!cfg || !audio || !pill) return;

    el('bgmTitle').textContent = cfg.title;
    el('bgmHint').textContent = cfg.artist;

    audio.src = cfg.src;
    audio.volume = 0;

    // 音源不可用（文件缺失 / 格式不被浏览器支持）时锁定胶囊，不再假装"点击播放"
    audio.addEventListener('error', () => {
      bgmState.failed = true;
      bgmState.want = false;
      setBgmUI('error');
    });

    // 底部播放器 / 其它入口控制同一音频时，胶囊 UI 跟着同步
    audio.addEventListener('play', () => { if (!bgmState.failed) setBgmUI('playing'); });
    audio.addEventListener('pause', () => { if (!bgmState.failed) setBgmUI('paused'); });

    pill.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgmState.failed) return;
      if (audio.paused) { bgmState.want = true; playBgm(); }
      else stopBgm();
    });

    // 有声自动播放被浏览器拦截时的兜底：等第一次手势（拖文件夹 / 随意点击）
    ['pointerdown', 'keydown'].forEach((ev) => {
      document.addEventListener(ev, () => {
        if (bgmState.failed || !bgmState.want) return;
        if (audio.muted) {
          audio.muted = false;      // 静音起播的，此刻放开声音
          audio.volume = 0;
          fadeBgm(siteData.bgm.volume);
          setBgmUI('playing');
        } else if (audio.paused) {
          playBgm();
        }
      }, { passive: true });
    });
  }

  /** 页面打开就尝试播放，开机结束后再把音乐胶囊显示出来 */
  function startBgm() {
    bgmState.want = true;
    playBgm();
  }

  function revealBgm() {
    const pill = el('bgmToggle');
    if (pill) pill.classList.add('is-on');
  }

  function playBgm() {
    const a = el('bgmAudio');
    if (!a || !a.src || bgmState.failed || !a.paused) return;
    a.volume = 0;
    const p = a.play();
    if (!p || !p.then) return;
    p.then(() => {
      a.muted = false;
      fadeBgm(siteData.bgm.volume);
      setBgmUI('playing');
    }).catch(() => {
      if (bgmState.failed) return;
      // 有声自动播放被拦截：先静音起播占位，首次交互时再放开声音
      a.muted = true;
      const p2 = a.play();
      if (p2 && p2.then) p2.then(() => setBgmUI('playing')).catch(() => setBgmUI('blocked'));
      else setBgmUI('blocked');
    });
  }

  function stopBgm() {
    bgmState.want = false;
    const a = el('bgmAudio');
    if (!a) return;
    fadeBgm(0, () => a.pause());
    setBgmUI('paused');
  }

  /** 音量淡入淡出，避免音乐突然砸下来 */
  function fadeBgm(target, done) {
    const a = el('bgmAudio');
    if (!a) return;
    clearInterval(bgmState.fadeTimer);
    const from = a.volume, steps = 16, dt = 40;
    let i = 0;
    bgmState.fadeTimer = setInterval(() => {
      i++;
      a.volume = Math.min(1, Math.max(0, from + (target - from) * (i / steps)));
      if (i >= steps) {
        clearInterval(bgmState.fadeTimer);
        if (done) done();
      }
    }, dt);
  }

  function setBgmUI(mode) {
    const pill = el('bgmToggle');
    if (!pill) return;
    pill.classList.toggle('is-playing', mode === 'playing');
    pill.setAttribute('aria-pressed', mode === 'playing' ? 'true' : 'false');
    const hint = el('bgmHint');
    if (mode === 'error') {
      hint.textContent = '音频不可用';
      pill.classList.add('is-off');
      return;
    }
    pill.classList.remove('is-off');
    if (mode === 'blocked' || mode === 'paused') hint.textContent = '点击播放';
    else hint.textContent = siteData.bgm.artist;
  }

  function openSite() {
    const desk = el('desktop'), site = el('site');
    if (site.classList.contains('is-open')) return;
    desk.classList.add('is-leaving');
    setTimeout(() => { desk.style.display = 'none'; }, 520);
    site.classList.add('is-open');
    document.body.classList.remove('is-locked');
    window.scrollTo(0, 0);
    observeReveals();
  }

  function backToDesktop() {
    el('site').classList.remove('is-open');
    showDesktop();
  }

  /* ============================================================
     鼠标拖尾（蓝绿渐变光点，覆盖所有页面）
     ============================================================ */
  function setupMouseTrail() {
    const cv = el('mouseTrail');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const pts = [];
    const LIFE = 520, MAX = 30;
    const C1 = [56, 189, 248], C2 = [45, 212, 191];   // 天蓝 → 青绿

    function resize() {
      cv.width = window.innerWidth * dpr;
      cv.height = window.innerHeight * dpr;
      cv.style.width = window.innerWidth + 'px';
      cv.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    window.addEventListener('pointermove', (e) => {
      pts.push({ x: e.clientX * dpr, y: e.clientY * dpr, t: performance.now() });
      if (pts.length > MAX) pts.shift();
    }, { passive: true });

    (function draw(now) {
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, cv.width, cv.height);
      while (pts.length && now - pts[0].t > LIFE) pts.shift();
      if (!pts.length) return;
      ctx.globalCompositeOperation = 'lighter';
      const n = pts.length;
      for (let i = 0; i < n; i++) {
        const p = pts[i];
        const k = 1 - (now - p.t) / LIFE;          // 剩余生命 1→0
        const m = n > 1 ? i / (n - 1) : 1;         // 在拖尾中的位置 尾→头
        const r = Math.round(C1[0] + (C2[0] - C1[0]) * m);
        const g = Math.round(C1[1] + (C2[1] - C1[1]) * m);
        const b = Math.round(C1[2] + (C2[2] - C1[2]) * m);
        const rad = (3 + 11 * k * m) * dpr;
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
        grad.addColorStop(0, `rgba(${r},${g},${b},${(0.55 * k).toFixed(3)})`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
    })(performance.now());
  }

  /* ============================================================
     滚轮整屏翻页（幻灯片式切换，仅桌面宽屏启用）
     ============================================================ */
  const slideSections = ['hero', 'notes', 'work', 'contact'];
  let slideLock = false;

  function currentSlideIndex() {
    // 用视口 60% 深度判定当前区块：区块边界附近归属下一个区块，
    // 保证最后一屏（页脚）在滚动被钳位后仍能被识别为当前页
    const y = window.scrollY + window.innerHeight * 0.6;
    let idx = 0;
    slideSections.forEach((id, i) => {
      const n = el(id);
      if (n && n.offsetTop <= y) idx = i;
    });
    return idx;
  }

  function goSlide(i) {
    const n = el(slideSections[i]);
    if (!n) return;
    slideLock = true;
    window.scrollTo({ top: n.offsetTop, behavior: 'smooth' });
    setTimeout(() => { slideLock = false; }, 900);
  }

  function setupSlideScroll() {
    window.addEventListener('wheel', (e) => {
      const site = el('site');
      if (!site || !site.classList.contains('is-open')) return;
      if (window.innerWidth < 1024) return;               // 窄屏保留原生滚动
      if (slideLock) { e.preventDefault(); return; }      // 翻页动画期间锁定
      if (Math.abs(e.deltaY) < 8) return;

      const vh = window.innerHeight, y = window.scrollY;
      const cur = currentSlideIndex();
      const node = el(slideSections[cur]);
      if (!node) return;
      const secTop = node.offsetTop, secBottom = secTop + node.offsetHeight;

      if (e.deltaY > 0) {
        // 当前区块比视口高且下半部分还没看完 → 原生滚动继续看
        if (secBottom - (y + vh) > 24) return;
        if (cur < slideSections.length - 1) { e.preventDefault(); goSlide(cur + 1); }
      } else {
        // 还没滚回当前区块顶部 → 原生滚动向回走
        if (y - secTop > 24) return;
        if (cur > 0) { e.preventDefault(); goSlide(cur - 1); }
      }
    }, { passive: false });
  }

  /* ============================================================
     第三层：作品集正文
     ============================================================ */

    el('navLinks').innerHTML = siteData.nav.map((i) => `<a class="nav-link" href="${i.href}">${i.label}</a>`).join('');

      .map((i) => `<a class="mobile-link" href="${i.href}"><span>${i.label}</span><span aria-hidden="true">→</span></a>`)
      .join('');
  }

    const btn = el('menuBtn'), menu = el('mobileMenu');

  let activeTab = 'ALL';

  function renderWork() {
    el('workLabel').textContent = siteData.work.label;
    el('workTitle').textContent = siteData.work.title;
    el('workTabs').innerHTML = siteData.work.tabs
      .map((t) => `<button type="button" role="tab" class="tab-btn${t.key === activeTab ? ' is-active' : ''}" data-tab="${t.key}" aria-selected="${t.key === activeTab}">${t.label}</button>`)
      .join('');
    el('workTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-tab]');
      if (btn) setWorkTab(btn.dataset.tab);

  /* 每个分类对应一套整页渐变色调（与该分类主图的色调呼应） */
  const PAGE_THEMES = {
    ALL:      'linear-gradient(180deg, #4facfe 0%, #38b6f6 38%, #00c9e8 62%, #a8e6cf 100%)',
    PEOPLE:   'linear-gradient(180deg, #3a7bd5 0%, #4fa8f0 40%, #22c1e8 72%, #8fe0f7 100%)',   // Frutiger Metro · 蓝青矢量
    PLACES:   'linear-gradient(180deg, #8a98ab 0%, #5b6d82 42%, #6b7d92 70%, #9fb0c2 100%)',   // Dark Aero · 钢蓝灰
    EMOTIONS: 'linear-gradient(180deg, #8fd96a 0%, #6cc24a 40%, #4db33a 70%, #a8e6a0 100%)',   // Frutiger Eco · 生态绿
    STORIES:  'linear-gradient(180deg, #2b9fc4 0%, #1eb6c4 40%, #2dd4bf 70%, #99f6e4 100%)',   // Helvetica Aqua · 海洋青
  };

  let _themeTimer = 0;
  function applyPageTheme(tab) {
    const g = PAGE_THEMES[tab] || PAGE_THEMES.ALL;
    const root = document.documentElement;
    const overlay = el('themeOverlay');
    if (!overlay) { root.style.setProperty('--page-gradient', g); return; }

    // 把 body 底色同步成覆盖层当前显示的渐变色，保证这次过渡是"上一色 → 新色"
    if (overlay.style.background) {
      root.style.setProperty('--page-gradient', overlay.style.background);
    }

    // 关键：先去掉过渡、瞬切到透明并换上新渐变，强制重排后再恢复过渡淡入。
    // 这样无论上一次覆盖层停在 opacity 几，都能重新触发一次完整的渐入，快速连点也不会跳变。
    overlay.style.transition = 'none';
    overlay.style.opacity = '0';
    overlay.style.background = g;
    void overlay.offsetHeight; // 强制重排，让浏览器记录"透明"这个起始状态
    overlay.style.transition = '';
    overlay.style.opacity = '1';

    clearTimeout(_themeTimer);
    _themeTimer = setTimeout(() => {
      // 淡入结束：底色换成新渐变，覆盖层淡出复位
      root.style.setProperty('--page-gradient', g);
      overlay.style.opacity = '0';
    }, 870);
  }

  function setWorkTab(tab) {
    activeTab = tab;
    $$('#workTabs .tab-btn').forEach((b) => {
      const on = b.dataset.tab === tab;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-selected', on);
    });
    applyPageTheme(tab);
    applyFx(tab);
    renderWorkGrid();
  }

  /* ===================== 页面环境特效 ===================== */
  const FX = {
    mode: 'none',
    canvas: null, ctx: null,
    raf: 0,
    rings: [],
    leaves: [],
    lastSpawn: 0,
    w: 0, h: 0, dpr: 1,
  };

  function fxInit() {
    FX.canvas = el('fxLayer');
    if (!FX.canvas) return;
    FX.ctx = FX.canvas.getContext('2d');
    fxResize();
    window.addEventListener('resize', fxResize);
  }
  function fxResize() {
    if (!FX.canvas) return;
    FX.dpr = Math.min(window.devicePixelRatio || 1, 2);
    FX.w = window.innerWidth;
    FX.h = window.innerHeight;
    FX.canvas.width = FX.w * FX.dpr;
    FX.canvas.height = FX.h * FX.dpr;
    FX.canvas.style.width = FX.w + 'px';
    FX.canvas.style.height = FX.h + 'px';
    FX.ctx.setTransform(FX.dpr, 0, 0, FX.dpr, 0, 0);
  }

  function fxStart(mode) {
    if (FX.mode === mode) return;
    FX.mode = mode;
    FX.rings = [];
    FX.leaves = [];
    FX.lastSpawn = 0;
    cancelAnimationFrame(FX.raf);
    const ctx = FX.ctx;
    const shine = el('fxShine');
    if (shine) shine.classList.toggle('is-on', mode === 'shine');
    if (mode === 'none' || mode === 'shine') {
      if (ctx) ctx.clearRect(0, 0, FX.w, FX.h);
      return;
    }
    let t0 = performance.now();
    const loop = (now) => {
      const dt = Math.min(now - t0, 50); t0 = now;
      ctx.clearRect(0, 0, FX.w, FX.h);
      if (FX.mode === 'ripple') drawRipples(now, dt);
      else if (FX.mode === 'leaves') drawLeaves(now, dt);
      FX.raf = requestAnimationFrame(loop);
    };
    FX.raf = requestAnimationFrame(loop);
  }

  /* p1 波纹：随机位置冒出不断扩大并淡出的圆环 */
  function drawRipples(now, dt) {
    const ctx = FX.ctx;
    if (now - FX.lastSpawn > 520) {
      FX.lastSpawn = now;
      const maxR = 80 + Math.random() * 160;
      FX.rings.push({
        x: Math.random() * FX.w,
        y: Math.random() * FX.h,
        r: 6,
        maxR,
        speed: 0.04 + Math.random() * 0.05,
        alpha: 0.9,
      });
    }
    for (let i = FX.rings.length - 1; i >= 0; i--) {
      const c = FX.rings[i];
      c.r += c.speed * dt;
      c.alpha = Math.max(0, 0.9 * (1 - c.r / c.maxR));
      if (c.alpha <= 0) { FX.rings.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${c.alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      // 内圈第二层，更淡
      if (c.r > 18) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r * 0.72, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,255,255,${c.alpha * 0.5})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  /* p3 落叶：从顶部飘落，带左右摆动和旋转 */
  function drawLeaves(now, dt) {
    const ctx = FX.ctx;
    if (now - FX.lastSpawn > 380) {
      FX.lastSpawn = now;
      FX.leaves.push({
        x: Math.random() * FX.w,
        y: -20,
        vy: 0.04 + Math.random() * 0.05,
        vx: (Math.random() - 0.5) * 0.03,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.003,
        size: 10 + Math.random() * 14,
        phase: Math.random() * Math.PI * 2,
        hue: 90 + Math.random() * 40, // 绿到黄绿
      });
    }
    for (let i = FX.leaves.length - 1; i >= 0; i--) {
      const l = FX.leaves[i];
      l.y += l.vy * dt;
      l.x += l.vx * dt + Math.sin(now * 0.001 + l.phase) * 0.3;
      l.rot += l.vrot * dt;
      const a = l.y > FX.h - 80 ? Math.max(0, (FX.h - l.y) / 80) : 1;
      if (l.y > FX.h + 20 || a <= 0) { FX.leaves.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      ctx.globalAlpha = a * 0.85;
      // 叶片形状（椭圆 + 叶脉）
      ctx.fillStyle = `hsl(${l.hue}, 60%, 45%)`;
      ctx.beginPath();
      ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `hsl(${l.hue}, 55%, 30%)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-l.size, 0); ctx.lineTo(l.size, 0);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  /* 根据标签切换环境特效 */
  function applyFx(tab) {
    const fish = el('fishLayer');
    const bubbles = el('globalBubbles');
    if (!FX.canvas) fxInit();

    if (tab === 'PEOPLE') {
      // p1：隐藏鱼和泡泡，显示波纹
      if (fish) fish.style.display = 'none';
      if (bubbles) bubbles.style.display = 'none';
      fxStart('ripple');
    } else if (tab === 'PLACES') {
      // p2：隐藏鱼和泡泡，金属光泽扫过
      if (fish) fish.style.display = 'none';
      if (bubbles) bubbles.style.display = 'none';
      fxStart('shine');
    } else if (tab === 'EMOTIONS') {
      // p3：隐藏鱼和泡泡，落叶
      if (fish) fish.style.display = 'none';
      if (bubbles) bubbles.style.display = 'none';
      fxStart('leaves');
    } else {
      // 全部 / Aqua Aero：恢复默认，关闭特效
      if (fish) fish.style.display = '';
      if (bubbles) bubbles.style.display = '';
      fxStart('none');
    }
  }

  function renderWorkGrid() {
    const items = siteData.work.items.filter((i) => activeTab === 'ALL' || i.cat === activeTab.toLowerCase());
    const grid = el('workGrid');
    const single = activeTab !== 'ALL';
    grid.classList.toggle('lg:grid-cols-4', !single);
    grid.classList.toggle('lg:grid-cols-[minmax(0,1fr)_minmax(0,1.4fr)]', single);

    const card = (i) => `
      <article class="work-card reveal is-in" data-work-card data-id="${i.id}">
        <div class="relative overflow-hidden">
          <img src="${i.image}" alt="${i.title}" class="aspect-[4/3] w-full object-cover" loading="lazy" />
          <span class="time-bubble">${fmt(i.duration)}</span>
          <div class="card-shine"></div>
        </div>
        <div class="p-5">
          <h3 class="font-display text-xl font-bold text-ink">${i.title}</h3>
          <p class="meta-label mt-2">${i.sub}</p>
        </div>
      </article>`;

    if (!single) {
      grid.innerHTML = items.map(card).join('');
      return;
    }

    const i = items[0];
    grid.innerHTML = card(i) + `
      <aside class="panel gloss reveal is-in flex flex-col justify-center gap-4 p-6 sm:p-8">
        <div>
          <h3 class="font-display text-2xl font-bold text-ink sm:text-3xl">${i.title}</h3>
          <p class="meta-label mt-2 text-base">${i.sub}</p>
        </div>
        <p class="text-[15px] leading-7 text-ink/80">${i.desc}</p>
      </aside>`;
  }

  /* 播放器 —— 直接控制页面背景音乐（#bgmAudio），可开关 */
  const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

  function renderPlayer() {
    const cfg = siteData.bgm;
    el('playerTitle').textContent = cfg.title;
    el('playerMeta').textContent = cfg.artist;
    el('playerThumb').src = 'assets/hero.jpg';
    el('waveform').innerHTML = Array.from({ length: 42 }, () => {
      const h = 20 + Math.round(Math.random() * 80);
      return `<span class="wave-bar" style="height:${h}%"></span>`;
    }).join('');
    syncPlayerUI();
  }

  function syncPlayerUI() {
    const a = el('bgmAudio');
    if (!a) return;
    el('timeCurrent').textContent = fmt(a.currentTime || 0);
    el('timeTotal').textContent = fmt(a.duration || 0);
    const ratio = a.duration ? a.currentTime / a.duration : 0;
    const bars = $$('#waveform .wave-bar');
    bars.forEach((b, i) => b.classList.toggle('on', i / bars.length <= ratio));
    el('playIcon').innerHTML = a.paused ? ICON_PLAY : ICON_PAUSE;
  }

  function attachPlayer() {
    const a = el('bgmAudio');
    if (!a) return;
    el('playBtn').addEventListener('click', () => {
      if (a.paused) { a.play().catch(() => {}); }
      else { a.pause(); }
    });
    ['timeupdate', 'play', 'pause', 'loadedmetadata', 'ended'].forEach((ev) =>
      a.addEventListener(ev, syncPlayerUI)
    );
  }

  function renderFooter() {
    const f = siteData.footer;
    el('footerLabel').textContent = f.label;
    el('footerTitle').textContent = f.title;
    el('footerEmail').textContent = f.email;
    el('footerEmail').href = f.email.includes('@') ? `mailto:${f.email}` : '#contact';
    el('socials').innerHTML = f.socials.map((s) => `<span class="cursor-pointer transition hover:text-ink">${s}</span>`).join('');
    el('copyright').textContent = f.copyright;
  }

  function spawnBubbles() {
    const layer = el('bubbleLayer');
    if (!layer) return;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 14; i++) {
      const b = document.createElement('span');
      const size = 8 + Math.random() * 26;
      b.className = 'bubble';
      b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;animation-duration:${9 + Math.random() * 14}s;animation-delay:-${Math.random() * 16}s;`;
      frag.appendChild(b);
    }
    layer.appendChild(frag);
  }

  let revealObserver = null;
  function observeReveals() {
    if (revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver(
      (entries) => entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('is-in'); revealObserver.unobserve(en.target); } }),
      { threshold: 0.12 }
    );
    $$('.reveal').forEach((n) => revealObserver.observe(n));
  }

  function init() {
    spawnGlobalBubbles();   // 全局漂浮泡泡（可戳破）
    setupFish();            // 热带鱼 3D 模型（点击游走）
    renderNav();
    renderHero();
    renderNotes();
    renderWork();
    fxInit();              // 页面环境特效层（波纹/金属光泽/落叶）
    renderPlayer();
    renderFooter();
    spawnBubbles();
    setupNav();
    attachPlayer();
    setupDesktop();
    setupBgm();             // 背景音乐
    startBgm();             // 打开页面即自动播放（被浏览器拦截时首次交互自动补播）
    setupMouseTrail();      // 鼠标蓝绿渐变拖尾
    setupSlideScroll();     // 滚轮整屏翻页
    el('backToDesktop').addEventListener('click', backToDesktop);
    runBoot(showDesktop);
  }

  init();
</script>
